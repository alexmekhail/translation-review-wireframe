# Local PostgreSQL for the backend. Written but not run where this repo was built (no Docker daemon there).
# The password comes from your environment or a git-ignored .env next to this file; nothing is hardcoded.
#   echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" > .env && docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or in .env}
      POSTGRES_DB: translation_review
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pgdata:
